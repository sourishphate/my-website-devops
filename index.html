<!DOCTYPE html>
<html>
<head>
    <title>CI/CD Demo - Updated</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #11998e, #38ef7d); /* changed gradient to show update */
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            opacity: 0.9;
        }

        .card {
            background: rgba(255, 255, 255, 0.2); /* slightly brighter */
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            backdrop-filter: blur(10px);
            box-shadow: 0px 8px 25px rgba(0,0,0,0.3); /* deeper shadow */
        }

        .footer {
            margin-top: 50px;
            font-size: 14px;
            opacity: 0.8;
        }

        .badge {
            margin-top: 20px;
            padding: 10px 20px;
            background: #ffdd57; /* changed color to indicate new build */
            color: black;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
        }

        .version {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>CI/CD Pipeline</h1>
            <p>Successfully Deployed with Latest Changes!</p>
            
            <div class="badge">
                 Build | Test | Deploy
            </div>

            <div class="version">
                Version: 1.1 - Deployed on: 02-Apr-2026
            </div>
        </div>

        <div class="footer">
            <p>DevOps Lab Experiment | Automated Deployment</p>
        </div>
    </div>

</body>
</html>
