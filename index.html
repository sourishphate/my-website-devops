<!DOCTYPE html>
<html>
<head>
    <title>CI/CD Demo</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            opacity: 0.9;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            backdrop-filter: blur(10px);
            box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
        }

        .footer {
            margin-top: 50px;
            font-size: 14px;
            opacity: 0.8;
        }

        .badge {
            margin-top: 20px;
            padding: 10px 20px;
            background: #00ffcc;
            color: black;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>🚀 CI/CD Pipeline</h1>
            <p>Successfully Deployed using Jenkins</p>
            
            <div class="badge">
                ✔ Build | ✔ Test | ✔ Deploy
            </div>
        </div>

        <div class="footer">
            <p>DevOps Lab Experiment | Automated Deployment</p>
        </div>
    </div>

</body>
</html>
